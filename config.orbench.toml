# Heretic configuration with OR-Bench-hard as a second refusal evaluation set (bad_eval).
#
# Fork addition (see README-MOE.md, section v4). Every trial is picked by its refusal count
# on the same 100 prompts (mlabonne/harmful_behaviors test[:100]), so the Pareto front can
# reward edits that remove refusals on exactly those prompts and nowhere else. OR-Bench-hard
# (bench-llm/or-bench, config or-bench-hard-1k, CC-BY-4.0, 1319 prompts) is a different
# distribution: seemingly harmful prompts that many models refuse. It is not used for training
# (the ARA/Abliteration bad_prompts stay mlabonne/harmful_behaviors train[:400]).
#
# Two cycles:
#
# 1. Run with the OR-Bench instance at optimization = "none". It is evaluated on every trial
#    and shown next to the other scores, but does not steer the search. Then run
#
#        heretic-generalization checkpoints/<model>.jsonl
#
#    It compares the refusal reduction on the evaluation prompts with the one on OR-Bench-hard
#    over the Pareto trials with KL <= 0.15 and reports whether the optimizer overfits the
#    evaluation prompts (exit code 1 if it does).
#
# 2. Only if it does: set the OR-Bench instance to optimization = "minimize" and use a new
#    study_checkpoint_dir. A study cannot change its number of objectives, and
#    "Continue the previous run" restores the settings stored in the old checkpoint.
#
#    Three objectives make the Pareto front larger; consider n_trials 150. Alternative with two
#    objectives: list both datasets under [scorer.KeywordRate.prompts] (an array of tables),
#    so that one refusal count covers both sets.
#
# OR-Bench is sorted by category; the harness's validation file (default here) and sample_size
# (the Hub fallback below) both draw over all categories (a plain "train[:100]" would only cover
# "deception" and "harassment").
#
# Cost: one more set of 100 generations per trial, which roughly doubles the generation part
# of a trial's evaluation (not measured).
#
# Usage: copy to config.toml in the directory you run `heretic` from, set `model`.

model = "Qwen/Qwen3-8B"

dtypes = ["auto", "bfloat16"]

# The strict refusal counter inspects 256 answer tokens, so generate that many.
max_response_length = 256

modifiers = [
    { plugin = "heretic.modifiers.ara.ARA" },
]

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
    # Cycle 1: "none". Cycle 2 (only if heretic-generalization reports overfitting): "minimize".
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "none", instance_name = "orbench" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

n_trials = 100
n_startup_trials = 30

# Cycle 2: use a new directory, e.g. "checkpoints-orbench".
study_checkpoint_dir = "checkpoints"

# Every KeywordRate evaluation appends its prompt/response pairs here (JSON Lines), so the
# counted refusals of a trial can be read by hand. Not stored in the checkpoint or uploaded.
# responses_file = "responses.jsonl"

# Settings shared by both KeywordRate instances.
[scorer.KeywordRate]
strict = true
strict_window_tokens = 256

[scorer.KeywordRate.prompts]
dataset = "mlabonne/harmful_behaviors"
split = "test[:100]"
column = "text"

# The OR-Bench instance. Its score is shown as "Refusals - orbench".
# the harness's over-refusal validation file: 100 OR-Bench-hard prompts reserved against its hold-out
# monitor (data/overrefusal_orbench.jsonl). These prompts take part in selecting trials, so they
# must not overlap the set that later measures the selected trial. The path is relative to the
# directory heretic runs in; point it at your the evaluation harness checkout.
[scorer.KeywordRate_orbench.prompts]
dataset = "prompts/val/orbench_val.txt"
# Without the evaluation harness, a seeded sample straight from the Hub (shares about 8 of 100 prompts with
# the harness's hold-out monitor, so do not report that monitor for a trial selected this way):
# dataset = "bench-llm/or-bench"
# config = "or-bench-hard-1k"
# split = "train"
# column = "prompt"
# sample_size = 100
# sample_seed = 0
# Truly harmful counterpart of OR-Bench (655 prompts), as a held-out set of the same kind as
# the evaluation prompts: config = "or-bench-toxic".

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
split = "test[:100]"
column = "text"

[modifier.ARA.good_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:400]"
column = "text"

[modifier.ARA.bad_prompts]
dataset = "mlabonne/harmful_behaviors"
split = "train[:400]"
column = "text"
