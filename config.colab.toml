# Heretic configuration for the Colab pipeline with refusal-eval's training sets
# (fork addition, branch colab-handoff; see README-MOE.md, "Colab handoff").
#
# Layout assumed in the Colab runtime (adjust the paths):
#   /content/refusal-eval          clone of refusal-eval (branch with train/, see below)
#   /content/drive/MyDrive/heretic Google Drive folder for everything that must survive a reset
#
# The prompt sets come from refusal-eval train/ (cyber-sets): bad_train / good_train for the
# modifier, bad_eval for the keyword objective and for ranking the best trials, the alpaca
# test[:100] for KL (= refusal-eval train/kl_eval). The evaluation hold-out
# (data/offsec_holdout*.jsonl) is not used here, so it keeps measuring the exported model
# independently.
#
# Two runs:
#
# 1. Optimization. Heretic runs the trials, then writes the answers of the original model and
#    the best trials on bad_eval to judge_ranking_output and exits (no terminal in Colab):
#
#      !heretic --model Qwen/Qwen3-8B
#
#    Judge them in a separate process (the judge must not share the GPU with the model):
#
#      !python /content/refusal-eval/judge_colab.py batch \
#          --responses /content/drive/MyDrive/heretic/candidates.responses.jsonl \
#          --out /content/drive/MyDrive/heretic/candidates.judged.jsonl \
#          --summary /content/drive/MyDrive/heretic/candidates.summary.json
#
#    Pick the trial with the lowest refusal + partial rate within the KL you accept
#    (the "trial" column; "base" is the original model).
#
# 2. Export the chosen trial N from the stored study:
#
#      !heretic --model Qwen/Qwen3-8B --checkpoint-action continue --trial-number N \
#          --model-action save --save-directory /content/drive/MyDrive/heretic/qwen3-8b-tN
#
#    Then measure the exported model on the hold-out with refusal-eval
#    (generate_colab.py + judge_colab.py), as before.
#
# Extra installs for the optional steps: `pip install trl` (heretic-dpo-pairs train);
# heretic-train-classifier uses transformers only (ModernBERT is downloaded on first use).

model = "Qwen/Qwen3-8B"

dtypes = ["auto", "bfloat16"]

# The strict keyword counter inspects 256 answer tokens.
max_response_length = 256

modifiers = [
    { plugin = "heretic.modifiers.ara.ARA" },
]

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
    # Once a classifier trained on judged answers agrees with the judge (binary kappa >= 0.75):
    # { plugin = "heretic.scorers.classifier_rate.ClassifierRate", optimization = "minimize" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

n_trials = 100
n_startup_trials = 30

# On Drive, so the study survives a runtime reset ("Continue the previous run" resumes it).
study_checkpoint_dir = "/content/drive/MyDrive/heretic/checkpoints"
responses_file = "/content/drive/MyDrive/heretic/keyword.responses.jsonl"

# Hand the best trials to the separate judge instead of judging here.
n_judge_ranking_trials = 8
judge_ranking_max_kl = 0.15
judge_ranking_response_length = 512
judge_ranking_mode = "generate"
judge_ranking_output = "/content/drive/MyDrive/heretic/candidates.responses.jsonl"
judge_ranking_prompts_file = "/content/refusal-eval/train/bad_eval.meta.jsonl"
judge_ranking_set = "bad_eval"
judge_ranking_model_name = "qwen3-8b-heretic"

[scorer.KeywordRate]
strict = true
strict_window_tokens = 256

[scorer.KeywordRate.prompts]
dataset = "/content/refusal-eval/train/bad_eval.txt"

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
split = "test[:100]"
column = "text"

[modifier.ARA.good_prompts]
dataset = "/content/refusal-eval/train/good_train.txt"

[modifier.ARA.bad_prompts]
dataset = "/content/refusal-eval/train/bad_train.txt"

# Judged answers of a previous model on the training prompts (not the hold-out), once
# refusal-eval can generate them (a generator set for train/bad_train is still to be added):
# [modifier.ARA]
# response_io_file = "/content/drive/MyDrive/heretic/train.responses.jsonl"
# response_io_judged_file = "/content/drive/MyDrive/heretic/train.judged.jsonl"

# For the Abliteration modifier (MoE models) the same files go into
# [modifier.Abliteration.good_prompts] / [modifier.Abliteration.bad_prompts].
